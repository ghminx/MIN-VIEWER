<script>
const q=new URLSearchParams(location.search);if(q.has('dark'))document.body.classList.add('dark');

const entries=[['학습 자료.pdf','PDF','오늘 · 3쪽','#b25a67','원본을 읽고 생각을 기록하는 방법','marked'],['주간 업무.hwpx','HWPX','오늘 · 2쪽','#458c8a','이번 주 업무 추진 계획',''],['발표 자료.pptx','PPTX','어제 · 4번째 슬라이드','#c18354','문서 읽기의 새로운 흐름','slides'],['월별 정리.xlsx','XLSX','어제 · Summary 시트','#4e8b6d','MONTHLY SUMMARY','table'],['요약 메모.docx','DOCX','11월 12일 · 1쪽','#547fac','자료 검토 및 요약 메모',''],['참고 목록.csv','CSV','11월 12일 · 120행','#7f8a59','REFERENCE LIST','table']];

 grid.innerHTML=items.map((e,i)=>`<article class="doc ${pages&&i===2?'current':''}" role="button" tabindex="0" aria-label="${e[0]} 열기" style="--type-color:${e[3]}"><div class="cover">${!pages&&['XLSX','CSV'].includes(e[1])?'<span class="type-cover">'+e[1]+'</span>':preview(e[4],e[5],String(i+1).padStart(2,'0'))}<span class="format">${e[1]}</span></div><div class="name" title="${e[0]}">${e[0]}</div><div class="meta">${e[1]} · ${e[2]}</div>${!pages?'<button class="menu" aria-label="'+e[0]+' 관리"><svg><use href="#more"/></svg></button>':''}</article>`).join('')||'<div class="empty">조건에 맞는 문서가 없습니다</div>';
