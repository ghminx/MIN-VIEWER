<header class="top"><div><h1>MIN VIEWER · 기존 | 개선 시안</h1><p>남색·Pretendard·+ 버튼 유지 · 문서 중심의 작은 개선 · 앱 반영 전 검토안</p></div><nav aria-label="시안 구분"><button data-board="main" aria-pressed="true">화면·탐색</button><button data-board="tools" aria-pressed="false">필기·메뉴</button><button data-board="details" aria-pressed="false">표·설정</button><button data-board="states" aria-pressed="false">입력·상태</button><button id="theme" aria-label="테마 전환"></button></nav></header>
<main id="content" class="board"></main>
<script>
const icon=n=>`<svg aria-hidden="true"><use href="#${n}"/></svg>`;
const btn=(n,label,extra='')=>`<button aria-label="${label}" ${extra}>${icon(n)}</button>`;
const paper=(title='자료를 읽고 기록하기',mini=false)=>`<div class="${mini?'paper-mini':'sheet'}"><${mini?'b':'h3'}>${title}</${mini?'b':'h3'}><div class="lines"></div>${mini?'':'<p>문서는 원래의 페이지 형태로 표시됩니다.<br>필기는 별도 사본에 보관합니다.</p><div class="inkline"></div>'}</div>`;
const bar=(title,pro=false,editing=false)=>`<div class="bar">${btn('back','뒤로')}<span class="grow">${title}</span>${pro?`<button class="mode ${editing?'active':''}" data-mode>${editing?'필기':'읽기'}</button>`:''}${btn('search','문서 검색')}${btn('more','문서 메뉴')}</div>`;
const foot=(type='pages')=>`<div class="footer"><button>${type==='sheet'?'시트':type==='csv'?'행 이동':'목록'}</button>${btn('prev','이전')}<span class="grow">${type==='sheet'?'Summary · 1 / 3':type==='csv'?'1–40행 · UTF-8':'3 / 24 · 100%'}</span>${btn('next','다음')}${btn('out','축소')}${btn('in','확대')}</div>`;
const thumbs=(pro=false)=>`<aside class="side"><div class="muted" style="font-size:12px;margin-bottom:6px">페이지</div>${[1,2,3].map(n=>`<div class="thumb ${n===3?'current':''}">${paper('원본 자료',true)}<div>${n}${pro&&n===3?' · 현재':''}</div></div>`).join('')}</aside>`;
const cards=(pro=false)=>`<div class="covers">${[['PDF','2026년 자료 검토 및 회의 기록.pdf'],['PPT','신제품 소개 발표.pptx'],['HWPX','주간 업무 계획.hwpx'],['CSV','월별 참고 자료.csv']].map(([f,n])=>`<div class="card"><div class="cover">${f==='CSV'?'CSV':paper(f==='PPT'?'발표 자료':'검토 자료',true)}</div><div class="cardname">${n}</div><div class="cardmeta">오늘 · ${pro?f:'오후 2:10'}</div></div>`).join('')}</div>`;
const home=pro=>`<div class="bar"><span class="grow brand"><b>MIN</b><span>VIEWER</span></span><button class="plus" aria-label="파일 열기">${icon('plus')}</button>${btn(pro?'settings':'more','설정')}</div><div class="body"><div class="headline"><h3>최근 문서</h3><div class="search">${icon('search')}문서 이름 검색</div></div><div class="filters">${['전체','PDF','한글','Word','PPT','Excel'].map((f,i)=>`<button aria-pressed="${i===0}" data-filter>${f}</button>`).join('')}<button class="toggle" aria-label="목록 보기로 전환" data-layout>${icon('list')}</button></div>${cards(pro)}</div>`;
const tools=(pro=false)=>`<div class="tools">${pro?'':btn('undo','실행 취소')+btn('redo','다시 실행')}${['pen','marker','eraser','lasso'].map((n,i)=>btn(n,['펜','형광펜','획 지우개','올가미'][i],`data-tool="${n}" aria-pressed="${i===0}"`)).join('')}<span class="divider"></span><button aria-label="색상·굵기"><span class="color-dot"></span></button>${pro?btn('undo','실행 취소')+btn('redo','다시 실행','disabled'):''}${btn('more','필기 도구 메뉴')}${pro?'<span class="save">'+icon('check')+'저장됨</span>':''}</div>`;
const penpopup=pro=>`<div class="floatpanel penpopup"><div class="headline"><h3>펜 ${pro?'설정':''}</h3><span class="grow"></span>${btn('close','설정 닫기')}</div><div class="preview"><svg viewBox="0 0 170 36"><path d="M5 25Q30-5 60 20T120 17Q140 5 165 12"/></svg></div><div class="swatches">${['#375f9d','#192d4d','#bf4650','#4e7d71','#d2a226','#7c649f'].map((c,i)=>`<button aria-label="${['파랑','남색','빨강','초록','노랑','보라'][i]}"><i style="background:${c}"></i></button>`).join('')}</div><div class="widths">${[1,3,5].map((n,i)=>`<button aria-pressed="${i===1}"><b style="height:${n}px"></b>${['가늘게','보통','굵게'][i]}</button>`).join('')}</div></div>`;
const viewer=pro=>`${bar('자료 검토.pdf',pro)}${pro?'':'<div class="thin-status">필기 복원 완료</div>'+tools()}<div class="viewer">${thumbs(pro)}<div class="grow" style="display:flex">${paper()}</div></div>${foot()}`;
const pen=pro=>`${bar('자료 검토.pdf',pro,true)}${pro?'':'<div class="thin-status">필기 저장 완료</div>'}${tools(pro)}<div class="viewer"><div class="grow" style="display:flex">${paper()}</div></div>${penpopup(pro)}${foot()}`;
const menu=pro=>`<div class="menu menu-position">${pro?'<div class="sectioncap">보기</div>':''}${['한쪽 보기','두쪽 보기','연속 보기'].map((n,i)=>`<button>${pro?icon('grid'):''}${n}${i===0?'<span class="check">'+icon('check')+'</span>':''}</button>`).join('')}${pro?'<div class="rule"></div><div class="sectioncap">필기·사본</div>':''}<button>${pro?icon('pen'):''}필기 시작</button><button>${pro?icon('export'):''}필기 포함 PDF 내보내기</button><button>${pro?icon('backup'):''}문서 백업</button></div>`;
const search=pro=>`${bar('자료 검토.pdf')}${pro?`<div class="searchbar"><input aria-label="문서 검색어" value="원본"><span class="results">2 / 8</span>${btn('prev','이전 검색 결과')}${btn('next','다음 검색 결과')}${btn('close','검색 닫기')}</div>`:''}<div class="viewer"><div class="grow" style="display:flex">${paper()}</div></div>${pro?'':`<div class="dialog" style="position:absolute;top:92px;left:50%;transform:translateX(-50%);width:80%"><h3>문서 검색</h3><input aria-label="검색어" value="원본"><div class="actions"><button>취소</button><button class="primary">찾기</button></div></div>`}${foot()}`;
const table=()=>`<div class="gridtable"><table><tr><th>월</th><th>계획</th><th>실적</th><th>증감</th><th>비고</th></tr>${['1월','2월','3월','4월','5월','6월'].map((n,i)=>`<tr><td>${n}</td><td>${120+i*7}</td><td>${125+i*9}</td><td>+${5+i*2}</td><td>확인</td></tr>`).join('')}</table></div>`;
const csv=pro=>`${pro?`<div class="bar">${btn('back','뒤로')}<span class="grow">월별 참고 자료.csv</span>${btn('more','표 도구 메뉴')}</div>`:'<div class="bar"><button>뒤로</button><span class="grow">월별 참고 자료.csv</span><button>이동</button><button>인코딩</button></div>'}${table()}${pro?foot('csv'):'<div class="footer"><button>이전</button><span class="grow">CSV · 1–100행 · 100%</span><button>다음</button></div>'}<div class="dialog" style="position:absolute;left:50%;top:76px;transform:translateX(-50%);width:80%"><h3>행으로 이동</h3>${pro?'<label for="row-proposed">행 번호</label>':''}<input id="row-${pro?'proposed':'existing'}" class="${pro?'invalid':''}" aria-label="이동할 행 번호" value="0" placeholder="행 번호">${pro?'<div class="error">1 이상의 행 번호를 입력해 주세요.</div>':''}<div class="actions"><button>취소</button><button class="primary">${pro?'이동':'확인'}</button></div></div>`;
const settings=pro=>`<div class="demoarea"><div class="dialog"><h3>설정</h3><div class="settings">${pro?'<div class="sectioncap">화면</div>':''}<div class="listrow">${pro?icon('sun'):''}<span>화면 테마</span>${pro?'<small>시스템 설정</small>':''}</div>${pro?'<div class="sectioncap" style="margin-top:8px">기기 내 데이터</div>':''}<div class="listrow">${pro?icon('backup'):''}<span>백업 복원</span></div><div class="listrow">${pro?icon('trash'):''}<span class="${pro?'danger':''}">${pro?'최근 기록 전체 지우기':'최근 문서 전체 삭제'}${pro?'<small class="sub">원본과 보관된 필기는 유지</small>':''}</span></div><div class="listrow"><span>오픈소스 라이선스</span></div></div></div></div>`;
const deletion=pro=>`<div class="demoarea"><div class="dialog"><h3>${pro?'보관 사본과 필기를 삭제할까요?':'삭제 확인'}</h3><p>${pro?'자료 검토.pdf':'보관한 PDF 사본과 필기를 삭제합니다. 외부 원본 파일은 삭제하지 않습니다.'}</p>${pro?'<div class="statusbox">앱에 보관한 PDF 사본과 필기가 삭제됩니다.<br>외부 원본 파일은 유지됩니다.</div>':''}<div class="actions"><button>취소</button><button class="danger-fill">${pro?'사본·필기 삭제':'삭제'}</button></div></div></div>`;
const password=pro=>`<div class="demoarea"><div class="dialog"><h3>문서 비밀번호</h3><p>${pro?'자료 검토.docx':'비밀번호가 맞지 않습니다. 다시 입력해 주세요.'}</p>${pro?'<label for="pass-proposed">비밀번호</label>':''}<div style="display:flex;gap:6px"><input id="pass-${pro?'proposed':'existing'}" aria-label="문서 비밀번호" type="password" value="example" class="${pro?'invalid':''}">${pro?'<button aria-label="비밀번호 표시" data-password><svg viewBox="0 0 24 24"><path d="M2 12q10-15 20 0-10 15-20 0Z"/><circle cx="12" cy="12" r="3"/></svg></button>':''}</div>${pro?'<div class="error">비밀번호가 맞지 않습니다. 다시 입력해 주세요.</div>':''}<div class="actions"><button>취소</button><button class="primary">열기</button></div></div></div>`;
const feedback=pro=>pro?`<div class="demoarea"><div class="stategrid"><div class="dialog"><h3>열 수 없는 문서</h3><p>파일 접근 권한을 확인해 주세요.</p><div class="actions"><button class="primary">다시 선택</button></div></div><div class="dialog"><h3>불러오는 중</h3><p>원본을 준비하고 있습니다.</p><div class="actions"><button>취소</button></div></div><div class="dialog"><h3>아직 연 문서가 없어요</h3><p>상단 + 버튼으로 열어 보세요.</p></div><div class="dialog"><h3 class="danger-text">필기 저장 실패</h3><p>저장되지 않은 필기를 유지합니다.</p><div class="actions"><button class="primary">다시 저장</button></div></div></div></div>`:`${bar('자료 검토.pdf')}<div class="annotation">PDF 오류: 파일 접근 권한을 확인해 주세요.</div><div class="viewer"></div><div class="footer"><span class="grow">PDF 오류: 파일 접근 권한을 확인해 주세요.</span></div>`;
const pair=(n,title,why,left,right)=>`<section class="pair"><div class="pair-heading"><h2>${n} · ${title}</h2><span>${why}</span></div><div class="compare"><div><div class="label">기존<small>현재 코드 기준 재구성 · 예시 문서</small></div><div class="frame">${left}</div></div><div class="proposed"><div class="label">개선 시안<small>제안 단계 · 실제 앱 미적용</small></div><div class="frame">${right}</div></div></div></section>`;
const boards={
main:()=>pair('01','홈 화면','새 메뉴를 늘리지 않고 제목과 버튼의 의미를 선명하게',home(false),home(true))+'<p class="recommend"><strong>추천</strong>설정은 톱니 아이콘으로 구분하고 파일명은 두 줄까지 표시함. 최근 문서 한 목록·형식 필터·한 개의 보기 전환 버튼을 유지함.</p>'+pair('02','읽기와 검색','문서를 가리는 검색창에서 문서 위의 결과 탐색 바로',search(false),search(true))+'<p class="recommend"><strong>추천</strong>검색어·결과 번호·이동 버튼을 함께 배치함. PDF는 Android 15 이상 제공 조건을 유지하며, 엔진이 지원하는 결과 이동만 노출함.</p>',
tools:()=>pair('03','필기 도구','선택 도구·임시 지우개·저장 상태를 구분',pen(false),pen(true))+'<p class="recommend"><strong>우선 적용 추천</strong>읽기/필기 전환을 상단에 노출하고 필기 중에만 도구를 표시함. 펜 버튼을 누르면 지우개를 임시 선택 표시하며 원래 펜 설정을 유지함.</p>'+pair('04','페이지 목록과 문서 메뉴','현재 페이지와 메뉴 그룹을 한눈에',viewer(false)+menu(false),viewer(true)+menu(true))+'<p class="recommend"><strong>추천</strong>선택 테두리와 페이지 번호를 함께 유지하고 메뉴를 보기 / 필기·사본으로 구분함. 창 크기에 따른 목록 접기·펼치기 동작은 그대로 유지함.</p>',
details:()=>pair('05','CSV · 표 탐색과 입력','뷰어마다 다른 버튼 표현과 오류 위치 정리',csv(false),csv(true))+'<p class="recommend"><strong>추천</strong>뒤로·확대·이동 도구의 스타일을 통일하고 잘못된 행 번호는 입력창 안에서 수정하도록 유지함. Excel은 같은 디자인으로 현재 시트 이름과 시트 수를 표시함.</p>'+pair('06','설정과 삭제 확인','메뉴를 늘리지 않고 삭제 대상과 보존 대상을 명확하게',settings(false),settings(true))+'<p class="recommend"><strong>추천</strong>최근 기록 지우기와 보관 사본·필기 삭제를 구분함. 글꼴 설정·클라우드·즐겨찾기·필기 문서 전용 탭은 추가하지 않음.</p>'+pair('07','보관 문서 삭제','위험 동작은 색뿐 아니라 구체적인 동작명으로',deletion(false),deletion(true))+'<p class="recommend"><strong>유지·개선</strong>기존 취소·삭제 확인을 유지하면서 버튼에 삭제 대상을 표시함. 저장 실패 안내·원본 보존 계약은 단순화를 이유로 숨기지 않음.</p>',
states:()=>pair('08','암호 입력','취소 경로는 유지하고 입력과 오류를 연결',password(false),password(true))+'<p class="recommend"><strong>추천</strong>입력란의 고정 이름·비밀번호 표시 전환·같은 입력창의 오류를 제공함. 비밀번호를 저장하거나 엔진의 지원 범위를 넓히는 제안이 아님.</p>'+pair('09','불러오기·빈 목록·오류','메시지와 다음 행동을 연결',feedback(false),feedback(true))+'<p class="recommend"><strong>추천</strong>안내를 용도별로 정리하고 복구 가능한 동작만 표시함. 취소·다시 저장 등의 상태 연결은 구현 시 별도 검증 대상이며, 이 시안은 동작 완료를 의미하지 않음.</p>'
};
let current='main';function render(){document.getElementById('content').className='board review-'+current;document.getElementById('content').innerHTML=boards[current]()+'<p class="note">비교 화면은 현재 소스의 배치를 바탕으로 재구성한 설명용 시안임. 메뉴는 대표 항목만 표시함. 실제 Android 캡처·구현 완료 화면이 아님. UI의 서체만 Pretendard로 적용하며 문서 글꼴·원본 비율은 변경하지 않음. 좁은 화면은 각 비교를 위아래로 배치함.</p>'; document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{b.classList.toggle('active');b.textContent=b.classList.contains('active')?'필기':'읽기';});document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{b.closest('.tools').querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{b.closest('.filters').querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});document.querySelectorAll('[data-password]').forEach(b=>b.onclick=()=>{const input=b.previousElementSibling;input.type=input.type==='password'?'text':'password';b.setAttribute('aria-label',input.type==='password'?'비밀번호 표시':'비밀번호 숨기기');});document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{const rows=b.getAttribute('aria-label').startsWith('목록');b.setAttribute('aria-label',rows?'격자 보기로 전환':'목록 보기로 전환');b.innerHTML=icon(rows?'grid':'list');const c=b.closest('.body').querySelector('.covers');c.style.gridTemplateColumns=rows?'1fr':'';c.style.overflow='auto';c.style.maxHeight='180px';});}
const params=new URLSearchParams(location.search);if(params.get('board') in boards)current=params.get('board');if(params.has('dark'))document.body.classList.add('dark');document.querySelectorAll('[data-board]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.board===current));b.onclick=()=>{current=b.dataset.board;document.querySelectorAll('[data-board]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();};});document.getElementById('theme').innerHTML=icon('sun');document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');render();
</script></body></html>
