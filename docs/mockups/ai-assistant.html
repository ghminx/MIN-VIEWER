<main class="review">
<div class="review-heading"><div class="eyebrow">MIN VIEWER / AI READING ASSISTANT</div><h1 id="board-title">문서를 읽는 흐름 안에, AI</h1><p class="intro">현재 페이지는 요약하고, 선택한 문장은 설명·번역하는 하나의 읽기 도우미.</p></div>
<div class="reviewbar"><nav class="reviewlinks" aria-label="시안 보기"><a href="?view=phones" data-view="phones">휴대폰 흐름</a><a href="?view=tablet&state=explain" data-view="tablet">태블릿 배치</a><button class="theme-button" id="theme">어두운 테마 보기</button></nav><div class="note">클릭 가능한 UI 시안 · 응답은 예시<br>실제 AI 연결 및 앱 적용 전</div></div>
<div id="boards"></div>
<p class="board-footer">시안 조작: 상단 AI로 열기·닫기 → 요약/설명/번역 전환 → 실행 버튼 → 결과 확인. 본문 강조 문장을 누르면 선택 메뉴가 열림. 확대 버튼으로 패널 높이 전환 가능.</p>
</main>
<script>
const params=new URLSearchParams(location.search),view=params.get('view')||'phones',initial=params.get('state')||'explain';
const icon=(name)=>'<svg aria-hidden="true"><use href="#'+name+'"></use></svg>';
const excerpt='도시의 녹지는 그늘을 만들고, 증산 작용을 통해 주변 공기의 온도를 낮춘다.';
const states=new Map();
function paper(selected){return '<article class="paper"><p class="kicker">ENVIRONMENT / RESEARCH NOTE</p><h2>도시의 녹지는<br>어떻게 열을 식힐까</h2><p class="deck">작은 숲이 만드는 도시의 변화<br>도시 환경 연구 · 2026년 11월</p><hr><h3>01. 나무가 만드는 시원한 공간</h3><p class="pick" tabindex="0" role="button" aria-label="이 문장 선택하기"><span class="'+(selected?'picked':'')+'">'+excerpt+'</span>'+(selected?'<i class="handle start"></i><i class="handle end"></i>':'')+'</p><p>나뭇잎은 햇빛이 지표면에 직접 닿는 것을 줄여 준다. 잎에서 수분이 증발할 때 열을 흡수하는 현상도 주변을 시원하게 만드는 데 기여한다.</p><h3>02. 녹지의 면적보다 중요한 연결</h3><p>공원을 늘리는 일과 함께 녹지를 서로 연결하는 설계가 필요하다. 가로수와 작은 정원이 이어지면 바람이 흐르는 통로를 만들 수 있다.</p><div class="chart" aria-label="녹지 연결 정도를 보여주는 예시 도표"><div class="bar" style="height:48%"><span>분산</span></div><div class="bar" style="height:70%"><span>부분 연결</span></div><div class="bar" style="height:96%"><span>연속 연결</span></div></div><p>도시마다 기후와 건물 밀도가 다르므로, 지역 조건을 함께 고려해야 한다.</p><footer>도시 환경 연구 / 03</footer></article>';}
function device(id,type,state){states.set(id,{type,mode:state==='translate'?'translate':state==='explain'?'explain':'summary',stage:state==='ready'?'ready':'result',open:true,selected:state==='translate'||state==='explain',menu:false,expanded:false});return '<div class="device '+type+'" id="'+id+'"></div>';}
const boards=document.querySelector('#boards');
if(view==='phones'){
 boards.className='phone-board';boards.innerHTML='<section class="demo"><p class="caption"><span class="step">01</span>필요할 때 여는 AI</p>'+device('phone-ready','phone','ready')+'<p class="under">상단 AI를 누르면 현재 페이지를 대상으로 열림.<br>요약 실행 전, 읽을 범위를 먼저 확인.</p></section><section class="demo"><p class="caption"><span class="step">02</span>현재 페이지 요약</p>'+device('phone-summary','phone','summary')+'<p class="under">문서는 위에, 결과는 아래에 나란히 표시.<br>근거 쪽으로 돌아가 읽고 질문을 이어갈 수 있음.</p></section><section class="demo"><p class="caption"><span class="step">03</span>선택한 문장 설명·번역</p>'+device('phone-translate','phone','translate')+'<p class="under">본문 선택 메뉴에서 설명·번역으로 연결.<br>원문을 바꾸지 않고 같은 패널에서 결과 확인.</p></section>';
}else{
 const solo=view==='phone'||view==='tablet-live';if(solo)document.body.classList.add('standalone');
 boards.className=solo?'':'tablet-board';boards.innerHTML=(solo?'':'<p class="caption"><span class="step">01</span>문서와 AI를 동시에 보는 태블릿</p>')+device('main',view==='phone'?'phone':'tablet',initial)+(solo?'':'<div class="insight"><div><strong>문서를 가리지 않는 오른쪽 패널</strong>목록은 닫고 AI를 표시. 본문과 선택 영역을 계속 보면서 결과 확인.</div><div><strong>작은 선택 메뉴 → 하나의 결과 패널</strong>복사·설명·번역만 빠르게 선택. 결과와 후속 질문은 오른쪽에 모음.</div><div><strong>기존 뷰어의 색상과 도구 유지</strong>네이비 상단바·Pretendard 유지. AI만 은은한 파란 강조로 구별.</div></div>');
}
function source(s){return '<div class="source"><small>'+(s.selected?'선택한 문장 · 3쪽':'현재 페이지 · 3 / 12쪽')+'</small>'+(s.selected?excerpt:'도시의 녹지는 어떻게 열을 식힐까')+'</div>';}
function result(s){
 const heading=s.mode==='summary'?'핵심 요약':s.mode==='explain'?'쉽게 풀어보기':'영어 번역';
 let body='<h3 class="result-title">'+heading+'</h3><div class="result-origin">'+(s.selected?'선택한 글':'현재 페이지')+' · 3쪽</div>';
 if(s.mode==='summary')body+='<p class="result-text">도시의 녹지는 <strong>그늘과 증산 작용</strong>으로 주변을 식히는 데 도움을 줍니다. 가로수와 정원이 이어지면 바람이 흐르는 통로가 될 수도 있습니다.</p><p class="result-text">다만 냉각 효과는 <strong>지역의 기후와 건물 밀도</strong>에 따라 달라집니다. 원문은 실제 측정과 충분한 관찰을 통해 효과를 확인해야 한다고 설명합니다.</p>';
 if(s.mode==='explain')body+='<h4 class="result-section">나무가 더위를 줄이는 두 가지 방법</h4><p class="result-text">나무는 <strong>그늘</strong>로 햇빛을 가리고, 잎에서 물이 증발할 때 주변의 열을 흡수해요. 이처럼 잎을 통해 수분이 빠져나가는 현상을 <strong>증산 작용</strong>이라고 해요.</p><h4 class="result-section">이해를 돕기 위한 예시</h4><p class="result-text">땀이 증발하면서 피부가 시원해지는 상황을 떠올려 보세요. 물이 기체로 바뀌는 데 열이 필요하다는 점에서 비슷해요. 나무에서도 수분이 증발할 때 열을 흡수해 냉각에 도움을 줄 수 있어요.</p><h4 class="result-section">원문과 연결해 보면</h4><p class="result-text">원문은 그늘과 증산뿐 아니라 연결된 녹지가 바람길 형성에 도움을 줄 수 있다고 설명해요. 다만 효과의 크기는 지역과 날씨에 따라 달라 충분한 관찰이 필요해요.</p>';
 if(s.mode==='translate')body+='<div class="translation-controls"><span>한국어</span><span aria-hidden="true">→</span><select aria-label="번역 언어"><option>영어</option><option>일본어</option></select></div><p class="result-text translated" lang="en">Urban greenery provides shade and cools the surrounding air through transpiration.</p>';
 return body+'<div class="result-actions"><button class="secondary" data-action="copy">'+icon('copy')+'결과 복사</button><button class="secondary" data-action="source">3쪽 보기</button></div><p class="disclaimer">AI가 생성한 내용으로, 원문과 다를 수 있어요.</p>';
}
function render(id){const s=states.get(id),el=document.getElementById(id);el.innerHTML='<div class="system"><span>9:41</span><span class="system-right"><span class="signal">▂▄▆</span><span>Wi-Fi</span><i class="battery"></i></span></div><header class="appbar"><button class="icon" data-action="back" aria-label="뒤로">'+icon('back')+'</button><div class="title"><div class="filename">도시의 녹지와 열섬 완화.pdf</div><div class="position">3 / 12 · 100%</div></div><button class="icon reading" data-action="reading" aria-label="읽기 모드">'+icon('book')+'</button><button class="icon" data-action="pages" aria-label="페이지 목록">'+icon('grid')+'</button><button class="ai-entry '+(s.open?'active':'')+'" data-action="toggle" aria-label="AI 도우미" aria-expanded="'+s.open+'"><span class="pill">'+icon('spark')+'</span></button><button class="icon" data-action="more" aria-label="더보기">'+icon('more')+'</button></header><div class="appbody"><div class="document" aria-label="문서 본문">'+paper(s.selected)+(s.menu?'<div class="selection-menu" aria-label="선택한 글 작업"><button data-action="copy-selection">'+icon('copy')+'복사</button><button data-action="select-all">모두 선택</button><button data-action="select-summary">요약</button><button data-action="select-explain">'+icon('explain')+'설명</button><button data-action="select-translate">'+icon('translate')+'번역</button></div>':'')+'</div>'+(s.open?panel(s):'')+'</div><div class="homebar"></div>';
 el.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>action(id,b.dataset.action)));
 el.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{s.mode=b.dataset.mode;s.stage='ready';render(id);}));
 const taskPicker=el.querySelector('.compact-task');if(taskPicker)taskPicker.addEventListener('change',()=>{s.mode=taskPicker.value;s.stage='ready';render(id);});
 el.querySelector('.pick').addEventListener('click',()=>action(id,'select'));
 el.querySelector('.pick').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action(id,'select');}});
 const scope=el.querySelector('.scope');if(scope)scope.addEventListener('change',()=>{s.selected=scope.value==='selection';s.stage='ready';render(id);});
 const language=el.querySelector('.translation-controls select');if(language)language.addEventListener('change',()=>{el.querySelector('.translated').textContent=language.value==='일본어'?'都市の緑は日陰をつくり、蒸散作用によって周囲の空気の温度を下げます。':'Urban greenery provides shade and cools the surrounding air through transpiration.';});
 const form=el.querySelector('form');if(form&&(innerHeight<=500||innerWidth<360))el.querySelector('.panelcontent').appendChild(form);if(form)form.addEventListener('submit',e=>{e.preventDefault();const input=form.querySelector('input');if(!input.value.trim())return;toast(id,'질문 전송 흐름 예시 · AI 미연결');});
 // 패널이 열려도 원문의 대상 문장을 문서 영역에 유지하는 시안 배치.
 const doc=el.querySelector('.document'),pick=el.querySelector('.pick');
 if(s.open&&!(s.type==='tablet'&&innerWidth>=720))doc.scrollTop=Math.max(0,pick.getBoundingClientRect().top-doc.getBoundingClientRect().top-75);
 const menu=el.querySelector('.selection-menu');if(menu)menu.style.top=(pick.getBoundingClientRect().top-doc.getBoundingClientRect().top+doc.scrollTop-57)+'px';
}
function panel(s){const labels={summary:'요약',explain:'설명',translate:'번역'};let body='';if(s.stage==='ready')body=source(s)+(s.mode==='translate'?'<div class="translation-controls"><span>한국어 →</span><select aria-label="번역 언어"><option>영어</option><option>일본어</option></select></div>':'')+'<h3 class="ready-title">'+(s.mode==='summary'?'이 페이지를 짧게 정리할까요?':s.mode==='explain'?'어떤 뜻인지 쉽게 알아볼까요?':'선택한 문장을 번역할까요?')+'</h3><p class="ready-copy">'+(s.mode==='summary'?'현재 페이지의 핵심 내용을<br>내용에 맞는 문단이나 목록으로 정리해요.':s.mode==='explain'?'선택한 부분의 뜻과 주요 용어를<br>문맥에 맞게 풀어서 설명해요.':'원문은 그대로 두고<br>번역 결과를 이곳에서 보여드려요.')+'</p><button class="primary" data-action="run">'+icon('spark')+labels[s.mode]+'하기</button>';
 else if(s.stage==='loading')body=source(s)+'<div class="status-message">'+labels[s.mode]+'하는 중이에요…</div><div class="loader"></div><button class="secondary" data-action="cancel">요청 취소</button>';
 else body=result(s);
 return '<aside class="panel '+(s.expanded?'expanded':'')+'" aria-label="AI 읽기 도우미"><div class="grip" aria-hidden="true"></div><header class="panelhead"><div class="panelname">'+icon('spark')+'AI 도우미</div><button class="icon" data-action="expand" aria-label="'+(s.expanded?'패널 줄이기':'패널 크게 보기')+'">'+icon('expand')+'</button><button class="icon" data-action="close" aria-label="AI 패널 닫기">'+icon('close')+'</button></header><div class="paneltop"><div class="scope-line"><select class="scope" aria-label="AI 처리 범위"><option value="page" '+(!s.selected?'selected':'')+'>현재 페이지 · 3쪽</option><option value="selection" '+(s.selected?'selected':'')+' '+(!s.selected?'disabled':'')+'>선택한 글 · 3쪽</option><option disabled>전체 문서 · 준비 필요</option></select><span class="local">'+icon('chip')+'기기 내 AI</span></div><div class="tabs" role="tablist" aria-label="AI 작업">'+Object.entries(labels).map(([key,label])=>'<button role="tab" aria-selected="'+(s.mode===key)+'" data-mode="'+key+'">'+label+'</button>').join('')+'</div><select class="compact-task" aria-label="AI 작업 선택">'+Object.entries(labels).map(([key,label])=>'<option value="'+key+'" '+(s.mode===key?'selected':'')+'>'+label+'</option>').join('')+'</select></div><div class="panelcontent" aria-live="polite">'+body+'</div>'+(s.stage==='result'?'<form class="panelbottom"><label class="question-label">이 내용에 이어서 질문</label><div class="question-row"><input aria-label="추가 질문" placeholder="궁금한 점을 입력하세요"><button class="send" aria-label="질문 보내기">'+icon('arrow')+'</button></div></form>':'')+'</aside>';
}
function toast(id,text){const el=document.getElementById(id);el.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=text;el.appendChild(t);setTimeout(()=>t.remove(),2200);}
function action(id,a){const s=states.get(id);if(a==='toggle'){s.open=!s.open;s.menu=false;}else if(a==='close'){s.open=false;}else if(a==='expand'){s.expanded=!s.expanded;}else if(a==='select'){s.selected=true;s.menu=true;s.open=false;}else if(a==='select-all'){toast(id,'현재 페이지 모두 선택 · 예시 화면');return;}else if(a==='select-summary'||a==='select-explain'||a==='select-translate'){s.mode=a.slice(7);s.selected=true;s.stage='ready';s.open=true;s.menu=false;}else if(a==='run'){s.stage='loading';render(id);s.timer=setTimeout(()=>{s.stage='result';render(id);},950);return;}else if(a==='cancel'){clearTimeout(s.timer);s.stage='ready';}else if(a==='again'){s.stage='ready';}else if(a==='copy'||a==='copy-selection'){toast(id,'복사 피드백 예시 · 시스템 복사는 앱 구현 시 연결');return;}else if(a==='source'){s.open=false;s.selected=true;render(id);document.getElementById(id).querySelector('.pick').scrollIntoView({block:'center',behavior:'smooth'});return;}else if(a==='pages'){s.open=false;s.menu=false;render(id);toast(id,'AI 패널을 닫고 페이지 목록으로 전환');return;}else {toast(id,'기존 뷰어 기능 · 이번 시안에서는 연결 생략');return;}render(id);}
for(const id of states.keys())render(id);
document.querySelectorAll('[data-view]').forEach(a=>a.classList.toggle('active',a.dataset.view===view));
if(view.startsWith('tablet'))document.getElementById('board-title').textContent='문서 옆에서, 함께 읽는 AI';
if(params.has('dark'))document.body.classList.add('dark');
const theme=document.getElementById('theme');function themeLabel(){theme.textContent=document.body.classList.contains('dark')?'밝은 테마 보기':'어두운 테마 보기';}themeLabel();theme.onclick=()=>{document.body.classList.toggle('dark');themeLabel();};
</script>
</body>
</html>
